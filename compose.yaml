
name: projeto-monitoramento

services:


  #Anderson
  servidor:
    build:
      context: .
      dockerfile: servidor/Dockerfile

    container_name: monitoramento-servidor

    command:
      - uvicorn
      - servidor.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --log-level
      - debug

    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/app/data-local/monitoramento.db}
      UDP_HOST: 0.0.0.0
      UDP_PORT: "9999"
      PYTHONUNBUFFERED: "1"

    ports:
      - "127.0.0.1:8000:8000/tcp"
      - "127.0.0.1:9999:9999/udp"

    volumes:
      - sqlite_data:/app/data
      - ./data:/app/data-local

    restart: unless-stopped

    networks:
      - monitoramento-net

  #Pedro
  sensor-ws-01:
    build:
      context: .
      dockerfile: sensores/Dockerfile

    command:
      - python
      - -m
      - sensores.sensor_temperatura_ws
      - --device-id
      - ${DEVICE_ID_SENSOR_WB}
      - --token
      - ${TOKEN_WB}
      - --url
      - ws://servidor:8000/ws/sensor
      - --intervalo
      - "2"

    environment:
      API_BASE_URL: http://servidor:8000
      WS_URL: ws://servidor:8000/ws/sensor
      PYTHONUNBUFFERED: "1"

    depends_on:
      - servidor

    restart: unless-stopped

    networks:
      - monitoramento-net
  
  #Pedro
  sensor-ws-02:
    build:
      context: ./sensores
      dockerfile: Dockerfile

    command:
      - python
      - sensor_ws.py
      - --device-id
      - sensor-ws-02
      - --interval
      - "2"

    environment:
      API_BASE_URL: http://servidor:8000
      WS_URL: ws://servidor:8000/ws/sensor
      PYTHONUNBUFFERED: "1"

    depends_on:
      - servidor

    restart: unless-stopped

    networks:
      - monitoramento-net

  #Pedro
  sensor-udp-01:
    build:
      context: ./sensores
      dockerfile: Dockerfile

    profiles:
      - udp

    command:
      - python
      - sensor_umidade_udp.py
      - --device-id
      - ${DEVICE_ID_SENSOR_UDP}
      - --token
      - ${TOKEN_UDP}
      - --host
      - servidor
      - --porta
      - "9999"
      - --intervalo
      - "2"

    environment:
      API_BASE_URL: http://servidor:8000
      UDP_HOST: servidor
      UDP_PORT: "9999"
      PYTHONUNBUFFERED: "1"

    depends_on:
      - servidor

    restart: unless-stopped

    networks:
      - monitoramento-net

  #Pedro
  painel:
    image: nginx:alpine

    container_name: monitoramento-painel

    ports:
      - "127.0.0.1:8080:80/tcp"

    volumes:
      - ./painel:/usr/share/nginx/html:ro
      - ./painel/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - servidor

    restart: unless-stopped

    networks:
      - monitoramento-net

  #Luis
  experimentos:
    build:
      context: ./experimentos
      dockerfile: Dockerfile

    profiles:
      - lab

    working_dir: /app

    volumes:
      - ./experimentos:/app
      - ./experimentos/resultados:/app/resultados

    environment:
      API_BASE_URL: http://servidor:8000
      WS_URL: ws://servidor:8000/ws/sensor
      UDP_HOST: servidor
      UDP_PORT: "9999"
      PYTHONUNBUFFERED: "1"

    command: ["sleep", "infinity"]

    depends_on:
      - servidor

    networks:
      - monitoramento-net

networks:
  monitoramento-net:
    driver: bridge

volumes:
  sqlite_data:
